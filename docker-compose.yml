version: "3.9"

services:
  neuro-chess:
    build:
      context: .
      dockerfile: Dockerfile
    image: neuro-chess:v3.0.1
    container_name: neuro-chess-engine
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
      - TORCH_NUM_THREADS=2
      - NEUROCHESS_WEIGHTS_DIR=/app/backend/weights
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
